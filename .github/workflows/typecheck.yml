name: typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Extractors gracefully handle a missing parent project — they fall
      # back to nulls/empty arrays — but they still need to run so the
      # *.generated.json files exist for the TS imports.
      - run: npm run extract

      - run: npm run typecheck

      - run: npm run build
